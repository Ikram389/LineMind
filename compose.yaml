services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the backend talks to the database, over Docker's internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      # Host port is configurable in case 8000 is already used on your machine.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Keep the node_modules installed in the image, instead of the (empty) host folder.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Run on demand: docker compose run --rm simulator python main.py --scenario ...
  # (the "simulator" profile keeps it out of a plain `docker compose up`).
  simulator:
    build: ./simulator
    profiles: ["simulator"]
    environment:
      LINEMIND_API_URL: http://backend:8000
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY:-}
      SIMULATOR_QUEUE_PATH: data/queue.sqlite
    volumes:
      # Code, scenarios, the unsent-event queue and output files live in ./simulator.
      - ./simulator:/app

volumes:
  postgres_data:
